# Correspondance orientation -> pose, par classe.
# Les sprites d'origine sont 7 poses d'un personnage qui tourne sur lui-même : on utilise une pose
# de face et une pose de dos, chacune avec son miroir. Modifiable ici sans recompiler.
# Valeur = numéro de pose (characters/<classe>_<n>.png), suffixe "m" = retourné horizontalement.
#
# Orientations à l'écran :  SE = vers le bas-droite (+x)   SW = vers le bas-gauche (+y)
#                           NE = vers le haut-droite (-y)  NW = vers le haut-gauche (-x)
warrior.SW = 1
warrior.SE = 1m
warrior.NE = 4
warrior.NW = 4m

mage.SE = 3
mage.SW = 3m
mage.NE = 7m
mage.NW = 7

# Archère : planche « chasseur » (tools/source/archer_sheet.png, importée par tools/import_sources.py).
# Sud-est et nord-est sont dessinés ; sud-ouest et nord-ouest en sont les miroirs. « .walk » = cycle de marche.
archer.scale = 0.43
archer.SE = se_idle
archer.SW = flip:se_idle
archer.NE = ne_idle
archer.NW = flip:ne_idle
archer.SE.walk = se_walk_1, se_walk_2, se_walk_3, se_walk_2
archer.SW.walk = flip:se_walk_1, flip:se_walk_2, flip:se_walk_3, flip:se_walk_2
archer.NE.walk = ne_walk_1, ne_walk_2, ne_walk_3, ne_walk_2
archer.NW.walk = flip:ne_walk_1, flip:ne_walk_2, flip:ne_walk_3, flip:ne_walk_2
