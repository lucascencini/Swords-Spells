# Correspondance orientation -> pose, par classe.
# Les sprites d'origine sont 7 poses d'un personnage qui tourne sur lui-même : on utilise une pose
# de face et une pose de dos, chacune avec son miroir. Modifiable ici sans recompiler.
# Valeur = numéro de pose (characters/<classe>_<n>.png), suffixe "m" = retourné horizontalement.
#
# Orientations à l'écran :  SE = vers le bas-droite (+x)   SW = vers le bas-gauche (+y)
#                           NE = vers le haut-droite (-y)  NW = vers le haut-gauche (-x)
warrior.SW = 1
warrior.SE = 1m
warrior.NE = 4
warrior.NW = 4m

mage.SE = 3
mage.SW = 3m
mage.NE = 7m
mage.NW = 7

archer.SE = 3
archer.SW = 3m
archer.NE = 7m
archer.NW = 7
