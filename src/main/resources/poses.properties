# Correspondance orientation -> pose, par classe. Modifiable ici sans recompiler.
# Valeur = nom de pose (characters/<classe>_<pose>.png), préfixe « flip: » = retournée horizontalement ;
# « .walk » = cycle de marche ; « .scale » = taille à l'écran.
#
# Orientations à l'écran :  SE = vers le bas-droite (+x)   SW = vers le bas-gauche (+y)
#                           NE = vers le haut-droite (-y)  NW = vers le haut-gauche (-x)
# Guerrier et Mage : planche tools/source/warrior_mage_sheet.png (importée par tools/import_sources.py).
warrior.scale = 0.392
warrior.SE = se_idle
warrior.SW = flip:se_idle
warrior.NE = ne_idle
warrior.NW = flip:ne_idle
warrior.SE.walk = se_walk_1, se_walk_2, se_walk_3, se_walk_2
warrior.SW.walk = flip:se_walk_1, flip:se_walk_2, flip:se_walk_3, flip:se_walk_2
warrior.NE.walk = ne_walk_1, ne_walk_2, ne_walk_3, ne_walk_2
warrior.NW.walk = flip:ne_walk_1, flip:ne_walk_2, flip:ne_walk_3, flip:ne_walk_2

mage.scale = 0.314
mage.SE = se_idle
mage.SW = flip:se_idle
mage.NE = ne_idle
mage.NW = flip:ne_idle
mage.SE.walk = se_walk_1, se_walk_2, se_walk_3, se_walk_2
mage.SW.walk = flip:se_walk_1, flip:se_walk_2, flip:se_walk_3, flip:se_walk_2
mage.NE.walk = ne_walk_1, ne_walk_2, ne_walk_3, ne_walk_2
mage.NW.walk = flip:ne_walk_1, flip:ne_walk_2, flip:ne_walk_3, flip:ne_walk_2

